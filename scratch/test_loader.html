<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ROOTS — Logo Writing Loader Test</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background-color: #060606;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .loader-container {
      width: 100%;
      max-width: 540px;
      padding: 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .roots-logo-svg {
      width: 100%;
      height: auto;
      display: block;
      filter: drop-shadow(0 0 1px rgba(229, 28, 36, 0.15));
    }

    /* Stroke mask drawing animations */
    .mask-stroke {
      fill: none;
      stroke: #ffffff;
      stroke-width: 48;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .mask-stroke-wide {
      stroke-width: 68;
    }

    /* Path animation keyframes */
    @keyframes drawStroke {
      to {
        stroke-dashoffset: 0;
      }
    }

    @keyframes fadeTagline {
      from {
        opacity: 0;
        transform: translateY(4px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* Animation sequencing:
       R: 0.00s - 0.70s (main loop + leg + tail + flourish)
       O1: 0.65s - 1.05s
       O2: 1.00s - 1.40s
       T:  1.35s - 1.75s
       S:  1.70s - 2.20s
       Tagline: 2.25s - 2.65s
       Hold: 2.65s - 3.10s
    */

    .stroke-r1 {
      stroke-dasharray: 1200;
      stroke-dashoffset: 1200;
      animation: drawStroke 0.65s cubic-bezier(0.4, 0, 0.2, 1) 0.1s forwards;
    }

    .stroke-r2 {
      stroke-dasharray: 600;
      stroke-dashoffset: 600;
      animation: drawStroke 0.45s cubic-bezier(0.4, 0, 0.2, 1) 0.35s forwards;
    }

    .stroke-r3 {
      stroke-dasharray: 500;
      stroke-dashoffset: 500;
      animation: drawStroke 0.35s cubic-bezier(0.4, 0, 0.2, 1) 0.55s forwards;
    }

    .stroke-r4 {
      stroke-dasharray: 500;
      stroke-dashoffset: 500;
      animation: drawStroke 0.35s cubic-bezier(0.4, 0, 0.2, 1) 0.60s forwards;
    }

    .stroke-o1 {
      stroke-dasharray: 400;
      stroke-dashoffset: 400;
      animation: drawStroke 0.40s cubic-bezier(0.4, 0, 0.2, 1) 0.70s forwards;
    }

    .stroke-o2 {
      stroke-dasharray: 400;
      stroke-dashoffset: 400;
      animation: drawStroke 0.40s cubic-bezier(0.4, 0, 0.2, 1) 1.00s forwards;
    }

    .stroke-t1 {
      stroke-dasharray: 600;
      stroke-dashoffset: 600;
      animation: drawStroke 0.40s cubic-bezier(0.4, 0, 0.2, 1) 1.25s forwards;
    }

    .stroke-t2 {
      stroke-dasharray: 400;
      stroke-dashoffset: 400;
      animation: drawStroke 0.30s cubic-bezier(0.4, 0, 0.2, 1) 1.50s forwards;
    }

    .stroke-s {
      stroke-dasharray: 600;
      stroke-dashoffset: 600;
      animation: drawStroke 0.45s cubic-bezier(0.4, 0, 0.2, 1) 1.65s forwards;
    }

    .mask-tagline {
      opacity: 0;
      animation: fadeTagline 0.40s cubic-bezier(0.16, 1, 0.3, 1) 2.05s forwards;
    }

    .mask-full-reveal {
      opacity: 0;
      animation: fadeTagline 0.35s ease-out 2.30s forwards;
    }
  </style>
</head>
<body>

  <div class="loader-container">
    <svg class="roots-logo-svg" viewBox="0 0 1200 800" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <mask id="roots-mask" maskUnits="userSpaceOnUse" x="0" y="0" width="1200" height="800">
          <!-- Black background: hidden by default -->
          <rect x="0" y="0" width="1200" height="800" fill="#000000" />
          
          <!-- R - Main upper loop from bottom left up through the top curve down to junction -->
          <path class="mask-stroke stroke-r1 mask-stroke-wide"
            d="M 45,550 C 40,430 110,230 250,135 C 330,80 430,95 490,195 C 530,270 480,430 375,565" />
          
          <!-- R - Left diagonal down to junction -->
          <path class="mask-stroke stroke-r2 mask-stroke-wide"
            d="M 245,385 L 375,565" />
          
          <!-- R - Tail shooting down right -->
          <path class="mask-stroke stroke-r3 mask-stroke-wide"
            d="M 375,565 L 530,725" />
          
          <!-- R - Underline flourish extending up-right -->
          <path class="mask-stroke stroke-r4"
            d="M 375,565 L 740,460" />
          
          <!-- O1 - First O loop -->
          <path class="mask-stroke stroke-o1 mask-stroke-wide"
            d="M 570,410 C 530,420 525,475 565,485 C 610,485 615,420 570,410 Z" />
          
          <!-- O2 - Second O loop -->
          <path class="mask-stroke stroke-o2 mask-stroke-wide"
            d="M 655,355 C 615,365 615,420 655,425 C 700,425 705,360 655,355 Z" />
          
          <!-- T - Upward rising stem & downstroke -->
          <path class="mask-stroke stroke-t1 mask-stroke-wide"
            d="M 625,275 L 780,125 C 765,200 745,280 735,360" />
          
          <!-- T - Cross bar -->
          <path class="mask-stroke stroke-t2 mask-stroke-wide"
            d="M 620,290 L 770,200" />
          
          <!-- S - Loop and body -->
          <path class="mask-stroke stroke-s mask-stroke-wide"
            d="M 760,200 C 790,140 860,115 890,145 C 925,180 920,240 885,270 C 850,300 815,320 830,345" />
          
          <!-- Tagline: The engine behind the brands -->
          <g class="mask-tagline">
            <rect x="480" y="525" width="710" height="90" fill="#ffffff" />
          </g>

          <!-- Final full reveal plate ensuring 100% exact logo coverage -->
          <rect class="mask-full-reveal" x="0" y="0" width="1200" height="800" fill="#ffffff" />
        </mask>
      </defs>

      <!-- The EXACT original ROOTS logo artwork, revealed via the handwriting mask -->
      <image href="../assets/images/roots-logo.png" x="0" y="0" width="1200" height="800" mask="url(#roots-mask)" preserveAspectRatio="xMidYMid meet" />
    </svg>
  </div>

  <div class="controls">
    <button onclick="location.reload()">Replay Animation</button>
  </div>

</body>
</html>
